<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>妆造写真助手</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 600px;
            max-width: 95%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: #4a69bd;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .header p {
            margin: 5px 0 0;
            opacity: 0.9;
        }
        .chat-box {
            height: 450px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        .message {
            margin-bottom: 15px;
            display: flex;
        }
        .message.user {
            justify-content: flex-end;
        }
        .message.agent {
            justify-content: flex-start;
        }
        .bubble {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            word-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .user .bubble {
            background: #4a69bd;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .agent .bubble {
            background: white;
            color: #333;
            border: 1px solid #ddd;
            border-bottom-left-radius: 4px;
        }
        .input-area {
            display: flex;
            padding: 15px;
            background: white;
            border-top: 1px solid #eee;
        }
        .input-area input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
        }
        .input-area input:focus {
            border-color: #4a69bd;
        }
        .input-area button {
            margin-left: 10px;
            padding: 12px 25px;
            background: #4a69bd;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .input-area button:hover {
            background: #3b5998;
        }
        .loading {
            text-align: center;
            color: #888;
            padding: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📸 妆造写真助手</h1>
        <p>套餐报价 · 档期查询</p>
    </div>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="请输入您的问题..." autofocus>
        <button onclick="sendMessage()">发送</button>
    </div>
</div>

<script>
    // 生成简单会话ID（每个标签页独立）
    const sessionId = 'session_' + Math.random().toString(36).substring(2, 10);

    function addMessage(text, role) {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message ' + role;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        msgDiv.appendChild(bubble);
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        input.value = '';
        showLoading(true);

        try {
            const res = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({session_id: sessionId, message: text})
            });
            const data = await res.json();
            addMessage(data.reply, 'agent');
        } catch (err) {
            addMessage('网络错误，请稍后重试。', 'agent');
        } finally {
            showLoading(false);
        }
    }

    function showLoading(show) {
        const chatBox = document.getElementById('chatBox');
        let loadingEl = document.getElementById('loadingIndicator');
        if (show) {
            if (!loadingEl) {
                loadingEl = document.createElement('div');
                loadingEl.id = 'loadingIndicator';
                loadingEl.className = 'loading';
                loadingEl.textContent = '🤔 思考中...';
                chatBox.appendChild(loadingEl);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        } else {
            if (loadingEl) loadingEl.remove();
        }
    }

    // 回车键发送
    document.getElementById('userInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') sendMessage();
    });

    // 初始欢迎语
    window.onload = function() {
        addMessage('👋 您好！我是妆造写真助手，可以帮您查询套餐价格和档期。请问有什么需要？', 'agent');
    };
</script>
</body>
</html>
