<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>栖帧 | 摄影</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&display=swap');
  body {
    margin: 0;
    background-color: #0a0a0a;
    color: #dcdcdc;
    font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
    line-height: 1.8;
  }
  .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    background: #050505;
    border-bottom: 1px solid #332b22;
  }
  .brand {
    color: #c8a876;
    font-size: 24px;
    letter-spacing: 8px;
    font-weight: 600;
  }
  .nav-links a {
    color: #dcdcdc;
    text-decoration: none;
    margin-left: 40px;
    font-size: 15px;
    letter-spacing: 4px;
    transition: color 0.3s;
  }
  .nav-links a:hover {
    color: #c8a876;
  }
  .hero {
    height: 65vh;
    background: url('{{ url_for("static", filename="images/FS(1).jpg") }}') center/cover no-repeat;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    animation: fadeZoom 2s ease-out;
    position: relative;
  }
  .hero::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
  }
  .hero h1 {
    color: #c8a876;
    font-size: 52px;
    font-weight: 300;
    letter-spacing: 15px;
    margin: 0 0 20px 0;
    position: relative;
    z-index: 1;
  }
  .hero p {
    color: #aaa;
    font-size: 16px;
    letter-spacing: 6px;
    position: relative;
    z-index: 1;
  }
  .features {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 30px;
    padding: 60px 40px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .feature-item {
    border: 1px solid #332b22;
    padding: 50px 20px;
    text-align: center;
    background: #080808;
    transition: transform 0.4s, box-shadow 0.4s;
  }
  .feature-item:hover {
    transform: translateY(-5px);
    box-shadow: 0 5px 20px rgba(200, 168, 118, 0.1);
  }
  .feature-icon {
    font-size: 28px;
    color: #c8a876;
    margin-bottom: 20px;
  }
  .feature-item h3 {
    color: #c8a876;
    font-size: 20px;
    font-weight: 400;
    letter-spacing: 6px;
    margin-bottom: 20px;
  }
  .feature-item p {
    color: #888;
    font-size: 14px;
    letter-spacing: 2px;
  }
  .footer {
    text-align: center;
    padding: 30px;
    background: #020202;
    color: #555;
    font-size: 13px;
    letter-spacing: 3px;
  }
  @keyframes fadeZoom {
    from { opacity: 0; transform: scale(1.05); }
    to { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
<div class="navbar">
  <div class="brand">栖帧</div>
  <div class="nav-links">
    <a href="/">首页</a>
    <a href="/gallery">作品集</a>
    <a href="/pricing">服务与价格</a>
  </div>
</div>

<div class="hero">
  <h1>栖 帧</h1>
  <p>定格时光 · 帧藏韵味</p>
</div>

<div class="features">
  <div class="feature-item">
    <div class="feature-icon">✦</div>
    <h3>定制妆造</h3>
    <p>资深造型师一对一定制<br>挖掘独特气质</p>
  </div>
  <div class="feature-item">
    <div class="feature-icon">✦</div>
    <h3>光影叙事</h3>
    <p>电影级布光<br>用光线勾勒最美轮廓</p>
  </div>
  <div class="feature-item">
    <div class="feature-icon">✦</div>
    <h3>私享体验</h3>
    <p>全程一对一服务<br>沉浸式拍摄享受</p>
  </div>
</div>

<div class="footer">© 2026 栖帧 | 摄影 · 定格你的帧藏</div>
</body>
</html>
